[platformio]
default_envs = crowpanel_green

[env]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
monitor_speed = 115200
build_unflags = -std=gnu++11
lib_deps =
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit BusIO@1.17.0
  bblanchon/ArduinoJson@7.3.1
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=1
  -DARDUINO_LOOP_STACK_SIZE=16384
  -I .
  -std=gnu++17
  -Wall
test_build_src = no
build_src_filter = +<*> -<panel_diagnostic.cpp>

[env:crowpanel_green]
build_flags = ${env.build_flags} -DCPW_GREEN_PANEL=1

[env:crowpanel_legacy]
build_flags = ${env.build_flags} -DCPW_GREEN_PANEL=0

; Display-only tests: no SD, saved settings, Wi-Fi, or weather API access.
; Software SPI follows the signal method used in Elecrow's example.
[env:display_test_green]
build_flags = ${env.build_flags} -DCPW_GREEN_PANEL=1 -DCPW_PANEL_BITBANG=1
build_src_filter = +<panel.cpp> +<panel_diagnostic.cpp>

[env:display_test_legacy]
build_flags = ${env.build_flags} -DCPW_GREEN_PANEL=0 -DCPW_PANEL_BITBANG=1
build_src_filter = +<panel.cpp> +<panel_diagnostic.cpp>
