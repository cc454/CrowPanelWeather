name: Firmware and native checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install platformio==6.1.18 pillow
      - name: Compile green weather app and display test
        run: pio run -e crowpanel_green -e display_test_green
      - name: Parser, DST and renderer checks
        run: python tools/test-native.py
      - name: Upload firmware and rendered screens
        uses: actions/upload-artifact@v4
        with:
          name: crowpanel-weather-firmware
          include-hidden-files: true
          path: |
            .pio/build/crowpanel_green/firmware.bin
            .pio/build/crowpanel_green/bootloader.bin
            .pio/build/crowpanel_green/partitions.bin
            .pio/build/display_test_green/firmware.bin
            .pio/build/display_test_green/bootloader.bin
            .pio/build/display_test_green/partitions.bin
            tests/build/*.png
            licenses/
            THIRD_PARTY.md
